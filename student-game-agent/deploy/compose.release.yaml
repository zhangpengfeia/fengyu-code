name: fengyucode-student-agent
x-agent: &agent
  image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/student-game-agent:${IMAGE_TAG:?Set IMAGE_TAG}
  env_file: ${AGENT_CREDENTIALS_FILE:?Set protected credentials file}
  environment:
    AGENT_ENVIRONMENT: production
    AGENT_MOCK_MODE: 'false'
    AGENT_DATABASE_URL: postgresql+psycopg://agent:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/student_game_agent
  networks: [backend]
  restart: unless-stopped
services:
  postgres:
    image: postgres:17.7
    environment:
      POSTGRES_DB: student_game_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [agent_postgres:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d student_game_agent']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *agent
    command: ['/app/.venv/bin/alembic', 'upgrade', 'head']
    restart: 'no'
    profiles: [tools]
  agent-api:
    <<: *agent
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ['CMD', '/app/.venv/bin/python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
  worker:
    <<: *agent
    command: ['/app/.venv/bin/python', '-m', 'src.workers.evaluation_worker']
    depends_on:
      postgres: {condition: service_healthy}
  student-web:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/student-web:${IMAGE_TAG:?Set IMAGE_TAG}
    ports: ['127.0.0.1:${HTTP_PORT:-18089}:8080']
    restart: unless-stopped
    depends_on:
      agent-api: {condition: service_healthy}
    networks:
      backend:
      gateway:
        aliases: [fengyucode-student-agent-web]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '4', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 15
networks:
  backend:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-crm-ai_default}
volumes:
  agent_postgres:
