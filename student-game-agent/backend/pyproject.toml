[project]
name = "student-game-agent"
version = "0.1.0"
description = "独立部署的学生游戏规则问答与测评后端"
requires-python = "==3.13.11"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn>=0.53,<0.54",
  "httpx>=0.28.1,<0.29",
  "pydantic-settings>=2.14,<3",
  "langgraph>=1.2.11,<1.3",
  "langchain-openai>=1.4.1,<2",
  "sqlalchemy[asyncio]>=2.0.46,<2.1",
  "aiosqlite>=0.22,<0.23",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.18,<2",
  "pyjwt>=2.10,<3",
  "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.15,<0.16"]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
