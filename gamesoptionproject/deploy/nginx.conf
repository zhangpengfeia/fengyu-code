# This Nginx runs inside the web container; the existing Caddy owns public 80/443.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Legacy public origin fails closed. New launches use the education /play/ gateway.
    # This container must share a network with the education-api service if retained.
    auth_request /_education_auth;
    error_page 401 403 500 502 503 504 =403 @education_denied;
    location = /_education_auth {
        internal;
        auth_request off;
        resolver 127.0.0.11 valid=30s;
        set $education_api http://education-api:8081;
        proxy_pass $education_api/play/planet/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @education_denied {
        auth_request off;
        default_type text/html;
        return 403 '<!doctype html><meta charset="utf-8"><title>没有权限</title><h1>没有权限访问该游戏</h1><p>请登录教育平台，通过已授权菜单进入。</p>';
    }

    location = /healthz {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /__release.txt {
        auth_request off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Vite hashes optimized images too; changed content gets a new URL.
    location ~* "^/assets/.+-[a-zA-Z0-9_-]{8,}\.(js|css|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
