# Example snippet to merge into the existing education platform server block.
# Build with VITE_BASE_PATH=/student/ VITE_EDUCATION_API_BASE=/prod-api npm run build
# Copy dist/* to /usr/share/nginx/html/student/.
# Keep the existing /prod-api/ and authenticated /play/ locations unchanged.
location = /student { return 302 /student/; }
location /student/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /student/index.html;
}
location /agent-api/ {
    proxy_pass http://student-game-agent:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
}
