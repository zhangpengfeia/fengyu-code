server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /student { return 302 /student/; }
    location = /healthz {
        proxy_pass http://agent-api:8088/health/ready;
        access_log off;
    }
    location = /student/__release.txt {
        add_header Cache-Control no-store always;
        try_files $uri =404;
    }
    # Integration credentials and local mock bootstraps are never public routes.
    location ~ ^/student/api/(internal|dev)(/|$) { return 404; }
    location /student/api/ {
        proxy_pass http://agent-api:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }
    location /student/ {
        try_files $uri $uri/ /student/index.html;
        add_header Cache-Control no-cache always;
    }
    location / { return 404; }
}
