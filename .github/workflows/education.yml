name: Education platform build and deploy
on:
  pull_request:
    paths: ['education-admin/**', 'gamesoptionproject/**', '.github/workflows/education.yml']
  push:
    paths: ['education-admin/**', 'gamesoptionproject/**', '.github/workflows/education.yml']
  workflow_dispatch:
concurrency:
  group: fengyucode-education-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: education-ci-disposable
          MYSQL_DATABASE: education
        options: >-
          --health-cmd="mysqladmin ping -peducation-ci-disposable"
          --health-interval=5s --health-retries=30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            education-admin/frontend/package-lock.json
            gamesoptionproject/package-lock.json
      - name: Validate fresh MySQL schema
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          for migration in education-admin/sql/V*.sql; do
            docker exec -i -e MYSQL_PWD=education-ci-disposable "$MYSQL_CONTAINER" mysql -uroot education < "$migration"
          done
      - name: Validate server release switching and recovery
        run: |
          bash -n education-admin/deploy/pipeline-deploy.sh
          python3 -m unittest discover -s education-admin/deploy/tests -v
      - name: Java permission and persistence tests
        working-directory: education-admin/backend
        run: mvn -B -ntp test package
      - name: Frontend build
        working-directory: education-admin/frontend
        run: |
          npm ci
          node --test tests/*.test.js
          npm run build
      - name: Package protected planet game
        run: |
          npm ci --prefix gamesoptionproject
          education-admin/scripts/build-games.sh

  demo-deployment:
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EDU_ADMIN_PASSWORD: DisposableCiAdmin!2026
      EDU_DEMO_PASSWORD: DisposableCiUser!2026
      EDU_TOKEN_SECRET: disposable-ci-memory-token-key-1234567890
    steps:
      - uses: actions/checkout@v6
      - name: Configure disposable demo test ports
        run: |
          cat > /tmp/education-ci-override.yaml <<'YAML'
          services:
            education-api:
              # Only this disposable CI instance disables captcha for HTTP tests.
              command: ["--education.dev-captcha-enabled=false"]
          YAML
      - name: Build and start demo without Redis or MySQL
        run: docker compose -f education-admin/deploy/compose.demo.yaml -f /tmp/education-ci-override.yaml up -d --build
      - name: Wait for demo backend
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:18090/prod-api/captchaImage > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify demo web and permission flows
        env:
          EDU_TEST_ADMIN_PASSWORD: ${{ env.EDU_ADMIN_PASSWORD }}
          EDU_TEST_DEMO_PASSWORD: ${{ env.EDU_DEMO_PASSWORD }}
        run: |
          curl -fsS http://localhost:18090/ > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18090/play/planet/index.html)" = 403
          python3 education-admin/scripts/smoke-test.py --allow-development --base http://localhost:18090 --api-prefix /prod-api
      - name: Show demo logs on failure
        if: failure()
        run: docker compose -f education-admin/deploy/compose.demo.yaml -f /tmp/education-ci-override.yaml logs --tail=150
      - name: Stop disposable demo
        if: always()
        run: docker compose -f education-admin/deploy/compose.demo.yaml -f /tmp/education-ci-override.yaml down --volumes

  publish:
    needs: demo-deployment
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set immutable release identity
        id: image
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build education API and bundled games
        uses: docker/build-push-action@v6
        with:
          context: .
          file: education-admin/deploy/Dockerfile.demo
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.prefix }}/web:api-${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=education-api
          cache-to: type=gha,mode=max,scope=education-api
      - name: Build website for the existing Caddy route
        uses: docker/build-push-action@v6
        with:
          context: education-admin
          file: education-admin/deploy/Dockerfile.web
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.prefix }}/web:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            WEB_PORT=8080
            RELEASE_ID=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=education-web
          cache-to: type=gha,mode=max,scope=education-web
      - name: Validate and publish website image
        env:
          IMAGE: ${{ steps.image.outputs.prefix }}/web:${{ steps.image.outputs.tag }}
        run: |
          docker run --rm --add-host education-api:127.0.0.1 "$IMAGE" nginx -t
          docker push "$IMAGE"

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://fengyucode.zhangff.cn
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Upload release and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_BASE_DIR: ${{ vars.DEPLOY_BASE_DIR || '/project/fengyucode' }}
          DEPLOY_NETWORK: ${{ vars.DEPLOY_NETWORK || 'crm-ai_default' }}
          DEPLOY_HTTP_PORT: ${{ vars.DEPLOY_HTTP_PORT || '18088' }}
          IMAGE_PREFIX: ${{ needs.publish.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          : "${IMAGE_PREFIX:?Missing image prefix from build job}"
          : "${IMAGE_TAG:?Missing image tag from build job}"
          [[ "$IMAGE_PREFIX" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]] || exit 2
          [[ "$IMAGE_TAG" =~ ^sha-[a-f0-9]{40}-[0-9]+-[0-9]+$ ]] || exit 2
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. Configure repository Actions secrets or production environment secrets."
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 2
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || exit 2
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || exit 2
          [[ "$DEPLOY_HTTP_PORT" =~ ^[0-9]+$ ]] || exit 2
          [[ "$DEPLOY_NETWORK" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]] || exit 2
          [[ "$DEPLOY_BASE_DIR" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_BASE_DIR" != *..* && "$DEPLOY_BASE_DIR" != / ]] || exit 2
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/fengyucode-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -lf "$ssh_dir/known_hosts" >/dev/null
          lookup_host="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then lookup_host="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$lookup_host" -f "$ssh_dir/known_hosts" > "$ssh_dir/matched_hosts"
          ssh-keygen -lf "$ssh_dir/matched_hosts" >/dev/null
          ssh_opts=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          # Failed-job reruns increment GITHUB_RUN_ATTEMPT without rebuilding images.
          # Deploy the exact tag published by the successful build job.
          tag="$IMAGE_TAG"
          prefix="$IMAGE_PREFIX"
          release_dir="$DEPLOY_BASE_DIR/releases/$tag/deploy"
          incoming="$DEPLOY_BASE_DIR/.pipeline/incoming/$tag.tar.gz"
          mkdir -p "$RUNNER_TEMP/education-release"
          cp education-admin/deploy/compose.release.yaml "$RUNNER_TEMP/education-release/compose.yaml"
          cp education-admin/deploy/pipeline-deploy.sh education-admin/deploy/education.release "$RUNNER_TEMP/education-release/"
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/education-release" compose.yaml pipeline-deploy.sh education.release
          ssh "${ssh_opts[@]}" -p "$DEPLOY_PORT" "$remote" \
            "umask 077; mkdir -p '$DEPLOY_BASE_DIR/.pipeline/incoming' '$release_dir'"
          scp "${ssh_opts[@]}" -P "$DEPLOY_PORT" "$RUNNER_TEMP/release.tar.gz" "$remote:$incoming"
          ssh "${ssh_opts[@]}" -p "$DEPLOY_PORT" "$remote" \
            "tar -xzf '$incoming' -C '$release_dir' && rm -f '$incoming' && bash '$release_dir/pipeline-deploy.sh' deploy '$DEPLOY_BASE_DIR' '$prefix' '$tag' '$DEPLOY_NETWORK' '$DEPLOY_HTTP_PORT'"
          printf '### Deployment complete\n\nhttps://fengyucode.zhangff.cn\n\nRelease: `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
