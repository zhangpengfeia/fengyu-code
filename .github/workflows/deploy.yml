name: Planet source checks

on:
  push:
    branches: [main]
    paths:
      - 'gamesoptionproject/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gamesoptionproject/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: gamesoptionproject

# Keep source checks serialized, including manual runs.
concurrency:
  group: fengyucode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gamesoptionproject/package-lock.json
      - name: Install dependencies
        timeout-minutes: 6
        run: |
          node --version
          npm --version
          npm config get registry
          npm ci --prefer-offline --no-audit --no-fund --foreground-scripts --loglevel=info
      - run: npm run format:check
      - name: Check repository formatting
        run: npx prettier --check --config .prettierrc.json --ignore-path .prettierignore ../README.md ../.github/workflows/deploy.yml
      - run: npm run build
      - name: Check deployment and recovery
        run: |
          bash -n deploy/pipeline-deploy.sh
          IMAGE_PREFIX=ghcr.io/validation/app IMAGE_TAG=validation docker compose -f deploy/compose.yaml config --quiet
          python3 -m unittest discover -s deploy/tests -v
