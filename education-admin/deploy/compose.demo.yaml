name: education-demo
services:
  education-api:
    build:
      context: ../..
      dockerfile: education-admin/deploy/Dockerfile.demo
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EDU_CACHE_TYPE: memory
      EDU_ADMIN_PASSWORD: ${EDU_ADMIN_PASSWORD:?set demo administrator password}
      EDU_DEMO_PASSWORD: ${EDU_DEMO_PASSWORD:?set demo teacher/student password}
      EDU_TOKEN_SECRET: ${EDU_TOKEN_SECRET:?set random token secret}
      EDU_ADMIN_ORIGIN: ${EDU_ADMIN_ORIGIN:-http://localhost:18090}
      EDU_GAME_ORIGIN: ${EDU_GAME_ORIGIN:-http://127.0.0.1:18091}
      EDU_SECURE_GAME_COOKIE: ${EDU_SECURE_GAME_COOKIE:-false}
      EDU_GAMES_ROOT: /games
    restart: unless-stopped
  admin-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ["${EDU_BIND_ADDRESS:-127.0.0.1}:${EDU_PORT:-18090}:80"]
    depends_on: [education-api]
    restart: unless-stopped
  games-web:
    image: nginx:1.28-alpine
    volumes: ["./nginx.games.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${EDU_BIND_ADDRESS:-127.0.0.1}:${EDU_GAME_PORT:-18091}:80"]
    depends_on: [education-api]
    restart: unless-stopped
