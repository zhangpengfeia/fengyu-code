server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /healthz {
        proxy_pass http://education-api:8081/biz/auth/status;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location = /__release.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /prod-api/ {
        proxy_pass http://education-api:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Trusted internal games share the site, but every asset goes through API authorization.
    location = /student { return 302 /student/; }
    location ^~ /student/ {
        # Resolve at request time so the current education site can start before
        # the independent student/Agent stack has been deployed.
        resolver 127.0.0.11 valid=10s;
        set $agent_gateway fengyucode-student-agent-web;
        proxy_pass http://$agent_gateway:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
    location ^~ /play/ {
        proxy_pass http://education-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
