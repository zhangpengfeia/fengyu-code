server {
    listen 80;
    server_name _;
    # This gateway serves protected game paths only. No admin assets or raw game volume.
    location /play/ {
        proxy_pass http://education-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
