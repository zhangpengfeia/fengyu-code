name: education-admin
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: education
      MYSQL_USER: education
      MYSQL_PASSWORD: ${EDU_DB_PASSWORD:?set EDU_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - education-db:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -u education --silent"]
      interval: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - education-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  education-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      SPRING_PROFILES_ACTIVE: education
      EDU_DB_URL: jdbc:mysql://mysql:3306/education?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false
      EDU_DB_USER: education
      EDU_DB_PASSWORD: ${EDU_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EDU_TOKEN_SECRET: ${EDU_TOKEN_SECRET:?set EDU_TOKEN_SECRET}
      EDU_ADMIN_PASSWORD: ${EDU_ADMIN_PASSWORD:?set EDU_ADMIN_PASSWORD}
      EDU_ADMIN_ORIGIN: ${EDU_ADMIN_ORIGIN:-https://fengyucode.zhangff.cn}
      EDU_GAME_ORIGIN: ${EDU_GAME_ORIGIN:-https://fengyucode.zhangff.cn}
      EDU_GAMES_ROOT: /games
      EDU_SECURE_GAME_COOKIE: ${EDU_SECURE_GAME_COOKIE:-true}
      EDU_EXTERNAL_HOSTS: ${EDU_EXTERNAL_HOSTS:-}
    volumes:
      - ../games:/games:ro
      - education-files:/app/.runtime
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  admin-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ["127.0.0.1:${EDU_PORT:-18090}:80"]
    depends_on: [education-api]
    restart: unless-stopped

volumes:
  education-db:
  education-redis:
  education-files:
