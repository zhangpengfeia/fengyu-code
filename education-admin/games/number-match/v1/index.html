<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字配对</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f5ff;color:#263b5c;margin:0;padding:48px 20px;text-align:center}main{max-width:740px;margin:auto;background:white;border:1px solid #dfe8f8;border-radius:18px;padding:36px}h1{font-size:30px}p{color:#7d8da8;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:30px 0}button.card{border:1px solid #d6e2f5;border-radius:12px;background:#f7faff;min-height:110px;font-size:28px;color:#406caf;cursor:pointer}button.selected{background:#dceaff;border-color:#477ed0}button.matched{background:#e3f6ee;border-color:#97d2bb;color:#3b946d;cursor:default}.restart{padding:12px 24px;border:0;border-radius:6px;background:#467fda;color:white;cursor:pointer}#message{min-height:28px;color:#408c6e}@media(max-width:500px){.cards{grid-template-columns:repeat(2,1fr)}main{padding:20px}}</style><main><small>数学思维 · 基础训练</small><h1>找到相同的数量</h1><p>依次点击数字和对应的圆点，完成四组配对。</p><div id="cards" class="cards"></div><div id="message" aria-live="polite"></div><button class="restart" id="restart">重新开始</button><p><small>此游戏为接入演示，练习结果不会写入正式积分。</small></p></main><script>
let first=null,matched=0,locked=false;const box=document.getElementById('cards'),msg=document.getElementById('message');
function start(){box.replaceChildren();first=null;matched=0;locked=false;msg.textContent='';let items=[];for(let n=1;n<=4;n++){items.push({n,label:String(n),type:'number'},{n,label:'●'.repeat(n),type:'dots'})}for(let i=items.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[items[i],items[j]]=[items[j],items[i]]}for(const item of items){const b=document.createElement('button');b.className='card';b.textContent=item.label;b.setAttribute('aria-label',item.type==='number'?'数字'+item.n:item.n+'个圆点');b.onclick=()=>{if(locked||b.disabled||first?.b===b)return;b.classList.add('selected');if(!first){first={b,item};return}const prev=first;first=null;if(prev.item.n===item.n&&prev.item.type!==item.type){b.className=prev.b.className='card matched';b.disabled=prev.b.disabled=true;matched++;msg.textContent=matched===4?'全部配对成功，做得很好！':'配对成功！'}else{locked=true;msg.textContent='再观察一下数量';setTimeout(()=>{b.classList.remove('selected');prev.b.classList.remove('selected');locked=false},650)}};box.appendChild(b)}}document.getElementById('restart').onclick=start;start();
</script></html>
